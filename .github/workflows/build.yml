          package com.widgetdesigner.app

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.view.View
          import android.widget.RemoteViews
          import java.io.File

          class DesignWidget : AppWidgetProvider() {

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  ids.forEach { update(context, manager, it) }
              }

              override fun onDeleted(context: Context, ids: IntArray) {
                  val e = prefs(context).edit()
                  ids.forEach { e.remove("w_$it") }
                  e.apply()
              }

              companion object {
                  fun prefs(c: Context) = c.getSharedPreferences("widgets", Context.MODE_PRIVATE)

                  fun load(c: Context, index: Int): Bitmap? {
                      val f = File(c.filesDir, "design_$index.png")
                      if (!f.exists()) return null
                      val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(f.path, bounds)
                      var sample = 1
                      while (bounds.outWidth / sample > 700) sample *= 2
                      return BitmapFactory.decodeFile(f.path, BitmapFactory.Options().apply { inSampleSize = sample })
                  }

                  fun update(c: Context, m: AppWidgetManager, id: Int): String? {
                      return try {
                          val rv = RemoteViews(c.packageName, R.layout.widget)
                          val index = prefs(c).getInt("w_$id", 0)
                          val bmp = load(c, index) ?: load(c, 0)
                          if (bmp != null) {
                              rv.setImageViewBitmap(R.id.img, bmp)
                              rv.setViewVisibility(R.id.hint, View.GONE)
                          }
                          val pi = PendingIntent.getActivity(
                              c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                          )
                          rv.setOnClickPendingIntent(R.id.img, pi)
                          m.updateAppWidget(id, rv)
                          if (bmp == null) "لا توجد صورة محفوظة" else null
                      } catch (e: Throwable) {
                          e.message ?: e.javaClass.simpleName
                      }
                  }

                  fun updateAll(c: Context): String? {
                      val m = AppWidgetManager.getInstance(c)
                      val ids = m.getAppWidgetIds(ComponentName(c, DesignWidget::class.java))
                      var err: String? = null
                      ids.forEach { val r = update(c, m, it); if (r != null && err == null) err = r }
                      return err
                  }
              }
          }
          EOF_FILE
