          cat > WidgetDesigner/app/src/main/java/com/widgetdesigner/app/MainActivity.kt <<'EOF_FILE'
          package com.widgetdesigner.app

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import org.json.JSONArray
          import java.io.File
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var chooserCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true

                  // اختيار صورة الخلفية من المعرض
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?, cb: ValueCallback<Array<Uri>>?, params: FileChooserParams?
                      ): Boolean {
                          chooserCallback?.onReceiveValue(null)
                          chooserCallback = cb
                          val i = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "image/*"
                          }
                          startActivityForResult(i, 1)
                          return true
                      }
                  }

                  web.addJavascriptInterface(Bridge(), "Android")
                  web.loadUrl("file:///android_asset/index.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 1) {
                      val uri = data?.data
                      chooserCallback?.onReceiveValue(if (resultCode == RESULT_OK && uri != null) arrayOf(uri) else null)
                      chooserCallback = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun addWidget(json: String) {
                      try {
                          val arr = JSONArray(json)
                          filesDir.listFiles()?.filter { it.name.startsWith("design_") }?.forEach { it.delete() }
                          for (i in 0 until arr.length()) {
                              val bytes = Base64.decode(arr.getString(i).substringAfter(","), Base64.DEFAULT)
                              File(filesDir, "design_$i.png").writeBytes(bytes)
                          }
                          val err = DesignWidget.updateAll(this@MainActivity)
                          val n = arr.length()
                          runOnUiThread {
                              if (err != null) {
                                  Toast.makeText(this@MainActivity, "تعذر تحديث الودجت: $err", Toast.LENGTH_LONG).show()
                              } else {
                                  Toast.makeText(this@MainActivity, "تم حفظ $n تصميم", Toast.LENGTH_SHORT).show()
                              }
                              requestPin()
                          }
                      } catch (e: Throwable) {
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "تعذر الحفظ: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              private fun requestPin() {
                  val m = AppWidgetManager.getInstance(this)
                  if (m.isRequestPinAppWidgetSupported) {
                      m.requestPinAppWidget(ComponentName(this, DesignWidget::class.java), null, null)
                  } else {
                      Toast.makeText(
                          this,
                          "اضغط مطولًا على الشاشة الرئيسية ثم الأدوات ثم مصمم الودجت",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
