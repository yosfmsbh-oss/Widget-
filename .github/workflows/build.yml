name: Build WidgetDesigner APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p "$(dirname WidgetDesigner/app/build.gradle.kts)"
          cat > WidgetDesigner/app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.widgetdesigner.app"
              compileSdk = 34
              signingConfigs {
                  create("fixed") {
                      storeFile = file("release-key.jks")
                      storePassword = "android"
                      keyAlias = "widgetdesigner"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("fixed") }
              }
              defaultConfig {
                  applicationId = "com.widgetdesigner.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p "$(dirname WidgetDesigner/app/src/main/AndroidManifest.xml)"
          cat > WidgetDesigner/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="مصمم الودجت"
                  android:icon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ConfigActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.Light">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".DesignWidget"
                      android:label="مصمم الودجت"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname WidgetDesigner/app/src/main/assets/index.html)"
          cat > WidgetDesigner/app/src/main/assets/index.html <<'EOF_FILE'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>مصمم ودجت الشاشة الرئيسية</title>
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&family=Tajawal:wght@500&family=Amiri:wght@700&family=Reem+Kufi:wght@600&family=Lemonada:wght@600&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Almarai" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Changa" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=El+Messiri" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Harmattan" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Jomhuria" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Katibeh" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Lalezar" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Lateef" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Markazi+Text" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Mada" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Mirza" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Rakkas" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Vibes" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Readex+Pro" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Kufam" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Marhey" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Alexandria" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Zain" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Vazirmatn" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Blaka" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Gulzar" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Qahiri" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Ruwudu" rel="stylesheet">
          <style>
          :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e2e0da;--acc:#0f766e;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--ink:#f0eee8;--mut:#a09e98;--line:#363532;--acc:#2dd4bf;--accink:#06201c}}
          :root[data-theme="dark"]{--bg:#161615;--card:#222221;--ink:#f0eee8;--mut:#a09e98;--line:#363532;--acc:#2dd4bf;--accink:#06201c}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
          h1{font-size:20px;margin:4px 0 14px;font-family:Cairo,sans-serif}
          .stage{background:repeating-conic-gradient(#8884 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:16px;padding:14px;display:flex;justify-content:center}
          canvas{max-width:100%;height:auto;border-radius:12px}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
          label{display:block;font-size:13px;color:var(--mut);margin:10px 0 6px}
          label:first-child{margin-top:0}
          textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
          textarea{min-height:64px;resize:vertical}
          input[type=range]{width:100%;accent-color:var(--acc)}
          .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
          .row>*{flex:1}
          input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
          .chips{display:flex;gap:8px;flex-wrap:wrap}
          .chip{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
          .chip.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
          .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
          .seg button{flex:1;font:inherit;padding:9px 4px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
          .seg button.on{background:var(--acc);color:var(--accink)}
          .go{width:100%;margin-top:14px;font:inherit;font-size:17px;font-family:Cairo,sans-serif;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);cursor:pointer}
          #msg{text-align:center;font-size:14px;color:var(--mut);line-height:1.7;margin:10px 0 24px}
          .hint{font-size:13px;color:var(--mut);text-align:center;margin:10px 0 0;line-height:1.7}
          .sm{margin:0;padding:10px;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-family:inherit}
          canvas{touch-action:none;cursor:grab}
          #flist{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
          #flist button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;cursor:pointer;font-size:24px;line-height:1.5}
          #flist button.on{background:var(--acc);color:var(--accink)}
          #flist .pv{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;text-align:start}
          #flist small{font-family:Tajawal,sans-serif;font-size:11px;opacity:.75;flex:none}
          #tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
          .tab{flex:none;font:inherit;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
          .tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
          .tab.add{border-style:dashed}
          </style>
          </head>
          <body>
          <h1>مصمم ودجت الشاشة الرئيسية</h1>
          <div id="tabs"></div>
          <div class="stage"><canvas id="cv"></canvas></div>
          <p class="hint">اسحب النص أو الصورة بإصبعك لتحريكها، وبإصبعين لتكبير الصورة</p>
          <div class="row" style="margin-top:10px"><button class="go sm" type="button" id="rt">إعادة مكان النص</button><button class="go sm" type="button" id="ri">إعادة مكان الصورة</button></div>

          <div class="card">
          <label>النص</label>
          <textarea id="txt">ولا تحزن إن الله معنا</textarea>
          <label>الخط</label>
          <select id="font" hidden>
          <option value="Cairo">القاهرة</option>
          <option value="Tajawal">تجوّل</option>
          <option value="Amiri" selected>أميري (نسخ)</option>
          <option value="Reem Kufi">ريم كوفي</option>
          <option value="Lemonada">ليمونادا</option>
          <option value="Aref Ruqaa">عارف رقعة</option>
          <option value="Almarai">المرعي</option>
          <option value="Changa">تشانجا</option>
          <option value="El Messiri">المسيري</option>
          <option value="Harmattan">هرمتان</option>
          <option value="Jomhuria">جمهورية</option>
          <option value="Katibeh">كاتبة</option>
          <option value="Lalezar">لالزار</option>
          <option value="Lateef">لطيف</option>
          <option value="Markazi Text">مركزي</option>
          <option value="Mada">مدى</option>
          <option value="Mirza">ميرزا</option>
          <option value="Rakkas">رقاص</option>
          <option value="Scheherazade New">شهرزاد</option>
          <option value="Vibes">فايبز (زخرفي)</option>
          <option value="Noto Kufi Arabic">نوتو كوفي</option>
          <option value="Noto Naskh Arabic">نوتو نسخ</option>
          <option value="Noto Nastaliq Urdu">نوتو نستعليق</option>
          <option value="Noto Sans Arabic">نوتو سانس</option>
          <option value="IBM Plex Sans Arabic">آي بي إم بلكس</option>
          <option value="Readex Pro">ريديكس</option>
          <option value="Baloo Bhaijaan 2">بالو بهيجان</option>
          <option value="Kufam">كوفام</option>
          <option value="Marhey">مرحي</option>
          <option value="Alexandria">الإسكندرية</option>
          <option value="Zain">زين</option>
          <option value="Vazirmatn">وزير</option>
          <option value="Blaka">بلاكا</option>
          <option value="Gulzar">غلزار</option>
          <option value="Playpen Sans Arabic">بلاي بن</option>
          <option value="Qahiri">قاهري</option>
          <option value="Ruwudu">رودو</option>
          </select>
          <div id="flist"></div>
          <label>حجم الخط: <span id="sv">64</span></label>
          <input type="range" id="size" min="20" max="140" value="64">
          <label>لون النص</label>
          <input type="color" id="tc" value="#ffffff">
          <label>المحاذاة</label>
          <div class="seg" id="al"><button data-v="right">يمين</button><button data-v="center" class="on">وسط</button><button data-v="left">يسار</button></div>
          </div>

          <div class="card">
          <label>الخلفية</label>
          <div class="chips" id="chips"></div>
          <div class="row" style="margin-top:10px"><input type="color" id="c1" value="#0f766e"><input type="color" id="c2" value="#134e4a"></div>
          <label>صورة الخلفية</label>
          <div class="row"><input type="file" id="file" accept="image/*" style="display:none"><button class="go" type="button" id="pick" style="margin:0;padding:10px;font-size:15px">اختر صورة</button><button class="go" type="button" id="rm" style="margin:0;padding:10px;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line)">إزالة</button></div>
          <label>تعتيم الصورة: <span id="dv">25</span>%</label>
          <input type="range" id="dim" min="0" max="80" value="25">
          <label>شفافية الخلفية: <span id="ov">100</span>%</label>
          <input type="range" id="op" min="0" max="100" value="100">
          <label>استدارة الزوايا: <span id="rv">48</span></label>
          <input type="range" id="rad" min="0" max="120" value="48">
          <label>الشكل</label>
          <div class="seg" id="shape"><button data-v="2" class="on">عريض</button><button data-v="1.4">متوسط</button><button data-v="1">مربع</button></div>
          <label>ظل النص</label>
          <div class="seg" id="sh"><button data-v="0">بدون</button><button data-v="1" class="on">خفيف</button><button data-v="2">قوي</button></div>
          </div>

          <div class="card">
          <label>إطار الحروف</label>
          <div class="seg" id="st"><button data-v="0" class="on">بدون</button><button data-v="1">مع إطار</button></div>
          <label>لون الإطار</label>
          <input type="color" id="sc" value="#000000">
          <label>سُمك الإطار: <span id="swv">4</span></label>
          <input type="range" id="sw" min="1" max="30" value="4">
          </div>

          <button class="go" id="save">إضافة الودجت إلى الشاشة الرئيسية</button>
          <p id="msg"></p>

          <script>
          const $=id=>document.getElementById(id);
          const cv=$('cv'),ctx=cv.getContext('2d');
          const presets=[['#0f766e','#134e4a'],['#7c3aed','#312e81'],['#e11d48','#7f1d1d'],['#f59e0b','#b45309'],['#0ea5e9','#1e3a8a'],['#111111','#3f3f46'],['#ec4899','#be185d']];
          let ratio=2,shadow=1,align='center',pick=0;let tx=0,ty=0,ix=0,iy=0,iz=1,tbox=null;
          presets.forEach((p,i)=>{const b=document.createElement('button');b.className='chip'+(i==0?' on':'');b.style.background=`linear-gradient(135deg,${p[0]},${p[1]})`;b.onclick=()=>{$('c1').value=p[0];$('c2').value=p[1];[...$('chips').children].forEach(c=>c.classList.remove('on'));b.classList.add('on');draw()};$('chips').appendChild(b)});
          function seg(id,fn){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v);draw()}}
          seg('al',v=>align=v);seg('shape',v=>ratio=+v);seg('sh',v=>shadow=+v);let stroke=0;seg('st',v=>stroke=+v);let bgimg=null;
          $('pick').onclick=()=>$('file').click();
          $('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{bgimg=im;ix=0;iy=0;iz=1;draw()};im.src=r.result};r.readAsDataURL(f)};
          $('rm').onclick=()=>{bgimg=null;ix=0;iy=0;iz=1;$('file').value='';draw()};
          ['txt','font','size','tc','c1','c2','op','rad','sc','sw','dim'].forEach(i=>$(i).addEventListener('input',draw));
          function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
          function draw(){
           const W=900,H=Math.round(W/ratio);cv.width=W;cv.height=H;
           $('sv').textContent=$('size').value;$('ov').textContent=$('op').value;$('rv').textContent=$('rad').value;
           ctx.clearRect(0,0,W,H);
           ctx.globalAlpha=$('op').value/100;
           const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,$('c1').value);g.addColorStop(1,$('c2').value);
           $('dv').textContent=$('dim').value;
           rr(0,0,W,H,+$('rad').value);
           if(bgimg){ctx.save();ctx.clip();const s=Math.max(W/bgimg.width,H/bgimg.height)*iz,iw=bgimg.width*s,ih=bgimg.height*s,mx=(iw-W)/2/W,my=(ih-H)/2/H;ix=Math.max(-mx,Math.min(mx,ix));iy=Math.max(-my,Math.min(my,iy));ctx.drawImage(bgimg,(W-iw)/2+ix*W,(H-ih)/2+iy*H,iw,ih);ctx.fillStyle='rgba(0,0,0,'+$('dim').value/100+')';ctx.fillRect(0,0,W,H);ctx.restore()}else{ctx.fillStyle=g;ctx.fill()}
           ctx.globalAlpha=1;
           const fs=+$('size').value*(W/560*0.9),pad=W*0.08;
           ctx.font=`${fs}px "${$('font').value}", sans-serif`;
           ctx.direction='rtl';ctx.textBaseline='middle';ctx.fillStyle=$('tc').value;
           ctx.textAlign=align;
           const x=(align==='center'?W/2:align==='right'?W-pad:pad)+tx*W;
           if(shadow){ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=shadow*10;ctx.shadowOffsetY=shadow*3}else{ctx.shadowColor='transparent'}
           const maxW=W-pad*2,lines=[];
           $('txt').value.split('\n').forEach(par=>{let cur='';par.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur)});
           const lh=fs*1.45,top=H/2-(lines.length-1)*lh/2+ty*H;let mw=0;lines.forEach(l=>{mw=Math.max(mw,ctx.measureText(l).width)});tbox={x:(align==='center'?x-mw/2:align==='right'?x-mw:x)-24,y:top-lh/2-12,w:mw+48,h:lines.length*lh+24};
           $('swv').textContent=$('sw').value;
           if(stroke){ctx.lineJoin='round';ctx.strokeStyle=$('sc').value;ctx.lineWidth=+$('sw').value*(W/560)*2;lines.forEach((l,i)=>ctx.strokeText(l,x,top+i*lh))}
           lines.forEach((l,i)=>ctx.fillText(l,x,top+i*lh));
           ctx.shadowColor='transparent';
           if(window.widgets&&!window.loading)widgets[cur]=getState();
          }
          const ptrs=new Map();let drag=null,pinch=null;
          function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
          cv.addEventListener('pointerdown',e=>{
           e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);ptrs.set(e.pointerId,p);
           if(ptrs.size===1){const t=tbox&&p.x>=tbox.x&&p.x<=tbox.x+tbox.w&&p.y>=tbox.y&&p.y<=tbox.y+tbox.h;drag=t?'text':(bgimg?'img':null);pinch=null}
           else if(ptrs.size===2&&bgimg){drag=null;const v=[...ptrs.values()];pinch={d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1,z:iz}}
          });
          cv.addEventListener('pointermove',e=>{
           if(!ptrs.has(e.pointerId))return;const p=pos(e),o=ptrs.get(e.pointerId);ptrs.set(e.pointerId,p);
           if(pinch&&ptrs.size>=2){const v=[...ptrs.values()];iz=Math.max(1,Math.min(4,pinch.z*Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)/pinch.d));draw()}
           else if(drag==='text'){tx=Math.max(-.5,Math.min(.5,tx+(p.x-o.x)/cv.width));ty=Math.max(-.5,Math.min(.5,ty+(p.y-o.y)/cv.height));draw()}
           else if(drag==='img'){ix+=(p.x-o.x)/cv.width;iy+=(p.y-o.y)/cv.height;draw()}
          });
          ['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{ptrs.delete(e.pointerId);drag=null;if(ptrs.size<2)pinch=null}));
          $('rt').onclick=()=>{tx=0;ty=0;draw()};
          $('ri').onclick=()=>{ix=0;iy=0;iz=1;draw()};
          function exp(){const t=document.createElement('canvas');t.width=600;t.height=Math.round(600*cv.height/cv.width);t.getContext('2d').drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/png')}
          $('save').onclick=()=>{const keep=cur,urls=[];widgets.forEach(w=>{setState(w);urls.push(exp())});setState(widgets[keep]);const m=$('msg');if(window.Android&&Android.addWidget){m.textContent='';Android.addWidget(JSON.stringify(urls))}else{m.textContent='هذا الزر يعمل داخل التطبيق بعد تثبيته على الجوال'}};
          const fams=[...$('font').options].map(o=>o.value);
          const fl=$('flist');
          [...$('font').options].forEach(o=>{const b=document.createElement('button');b.type='button';b.dataset.f=o.value;b.style.fontFamily='"'+o.value+'",sans-serif';b.innerHTML='<span class="pv"></span><small>'+o.textContent+'</small>';b.onclick=()=>{$('font').value=o.value;mark();draw()};fl.appendChild(b)});
          function mark(){[...fl.children].forEach(b=>b.classList.toggle('on',b.dataset.f===$('font').value))}
          function pv(){const t=($('txt').value.split('\n')[0]||'أبجد هوز').slice(0,30);fl.querySelectorAll('.pv').forEach(s=>s.textContent=t)}
          $('txt').addEventListener('input',pv);pv();mark();
          var widgets=[],cur=0,loading=false;
          function getState(){return{txt:$('txt').value,font:$('font').value,size:$('size').value,tc:$('tc').value,c1:$('c1').value,c2:$('c2').value,op:$('op').value,rad:$('rad').value,sc:$('sc').value,sw:$('sw').value,dim:$('dim').value,ratio,shadow,align,stroke,bgimg,tx,ty,ix,iy,iz}}
          function setSeg(id,v){[...$(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
          function setState(s){loading=true;['txt','font','size','tc','c1','c2','op','rad','sc','sw','dim'].forEach(k=>$(k).value=s[k]);ratio=s.ratio;shadow=s.shadow;align=s.align;stroke=s.stroke;bgimg=s.bgimg;tx=s.tx;ty=s.ty;ix=s.ix;iy=s.iy;iz=s.iz;setSeg('al',align);setSeg('shape',ratio);setSeg('sh',shadow);setSeg('st',stroke);[...$('chips').children].forEach(c=>c.classList.remove('on'));mark();pv();draw();loading=false}
          function tabs(){const t=$('tabs');t.innerHTML='';const mk=(txt,cls,fn)=>{const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=txt;b.onclick=fn;t.appendChild(b)};
           widgets.forEach((w,i)=>mk('ودجت '+(i+1),'tab'+(i==cur?' on':''),()=>{if(i!=cur){cur=i;setState(widgets[i]);tabs()}}));
           mk('+ إضافة ودجت','tab add',()=>{widgets.push(Object.assign({},getState()));cur=widgets.length-1;tabs()});
           if(widgets.length>1)mk('🗑 حذف هذا','tab add',()=>{widgets.splice(cur,1);cur=Math.max(0,cur-1);setState(widgets[cur]);tabs()})}
          widgets=[getState()];tabs();
          draw();
          if(document.fonts){Promise.all(fams.map(f=>document.fonts.load(`20px "${f}"`,'أ').catch(()=>0))).then(draw);document.fonts.ready.then(draw)}
          </script>
