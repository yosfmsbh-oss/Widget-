          package com.widgetdesigner.app

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.Intent
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class ConfigActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setResult(RESULT_CANCELED)

                  val id = intent?.extras?.getInt(
                      AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID
                  ) ?: AppWidgetManager.INVALID_APPWIDGET_ID
                  if (id == AppWidgetManager.INVALID_APPWIDGET_ID) { finish(); return }

                  val count = filesDir.listFiles()?.count { it.name.startsWith("design_") } ?: 0
                  if (count == 0) {
                      Toast.makeText(
                          this, "افتح التطبيق وصمم ودجتك واضغط «حفظ كصورة» أولًا", Toast.LENGTH_LONG
                      ).show()
                      finish(); return
                  }

                  if (count == 1) { pick(id, 0); return }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 32, 32, 32)
                  }
                  root.addView(TextView(this).apply { text = "اختر التصميم"; textSize = 20f })

                  for (i in 0 until count) {
                      val bmp = DesignWidget.load(this, i) ?: continue
                      val iv = ImageView(this).apply {
                          setImageBitmap(bmp)
                          adjustViewBounds = true
                          scaleType = ImageView.ScaleType.FIT_CENTER
                          setPadding(0, 24, 0, 24)
                          setOnClickListener { pick(id, i) }
                      }
                      root.addView(
                          iv,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              private fun pick(id: Int, index: Int) {
                  DesignWidget.prefs(this).edit().putInt("w_$id", index).apply()
                  DesignWidget.update(this, AppWidgetManager.getInstance(this), id)
                  setResult(RESULT_OK, Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id))
                  finish()
              }
          }
          EOF_FILE
